<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAP — 普通员工</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --text:#131825;
  --text-2:#73726e;
  --text-3:#ababa9;
  --bg:#eef2f7;
  --card:#fff;
  --border:#e8eaed;
  --urgent:#e53935;
  --urgent-bg:#fff5f5;
  --urgent-border:#ffcdd2;
  --orange-bg:#fff8f0;
  --orange-border:#ff9800;
  --orange-text:#e65100;
  --blue-tag-bg:#e8f4fd;
  --blue-tag-text:#1565c0;
  --btn-dark:#1a1a1a;
  --escalate-bg:#f0f7ff;
  --escalate-border:#90caf9;
  --escalate-text:#1565c0;
  --font:'Inter','Noto Sans SC','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}

html,body{width:100%;height:100%;overflow:hidden;}

.page{
  min-height:100vh;
  background:linear-gradient(165deg,#eef3f9 0%,#e9eef5 45%,#f2f0f8 100%);
  font-family:var(--font);
  color:var(--text);
}

.scroll{
  height:100vh;overflow-y:auto;
  padding:48px 32px 40px;
}
.scroll::-webkit-scrollbar{width:4px;}
.scroll::-webkit-scrollbar-thumb{background:#00000014;border-radius:2px;}

.wrap{max-width:520px;margin:0 auto;}

/* Role badge */
.role-badge{position:fixed;top:16px;left:16px;z-index:100;}
.role-badge summary{
  list-style:none;display:flex;align-items:center;gap:8px;
  padding:6px 14px 6px 6px;border-radius:20px;
  border:1px solid rgba(255,255,255,.65);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(12px);
  font-size:13px;font-weight:500;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.role-badge summary::-webkit-details-marker{display:none;}
.role-av{
  width:28px;height:28px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;
  background:rgba(28,100,242,.1);color:#1C64F2;
}
.role-drop{
  position:absolute;top:44px;left:0;min-width:200px;
  padding:4px;border-radius:12px;background:#fff;
  border:1px solid var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.role-drop a{
  display:block;padding:8px 12px;border-radius:8px;
  font-size:13px;color:var(--text);text-decoration:none;
}
.role-drop a:hover{background:#f5f5f5;}
.role-drop a.active{background:#e8f0fe;color:#1C64F2;font-weight:600;}

/* Header */
.date-main{font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.02em;}
.date-day{font-size:14px;color:var(--text-3);margin-top:4px;margin-bottom:16px;}
.brief{
  font-size:14px;line-height:1.75;color:var(--text-2);
  margin-bottom:28px;
}
.brief strong{font-weight:600;color:var(--text);}

/* Section label */
.sec{
  font-size:11px;font-weight:700;
  color:var(--text-3);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:10px;
}

/* ── Doing card (unified) ── */
.doing-card{
  background:var(--urgent-bg);
  border:1px solid var(--urgent-border);
  border-radius:14px;
  padding:16px 16px 14px;
  margin-bottom:28px;
}
.doing-card.resolved{opacity:.55;pointer-events:none;}

.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  margin-bottom:6px;cursor:pointer;
}
.card-title-row{
  display:flex;align-items:flex-start;gap:6px;flex:1;min-width:0;
}
.card-emoji{font-size:15px;line-height:1.4;flex-shrink:0;}
.card-title{
  font-size:15px;font-weight:700;line-height:1.45;color:var(--text);
}
.card-chevron{
  flex-shrink:0;color:var(--text-3);font-size:18px;line-height:1;margin-top:1px;
}

.ddl-line{
  font-size:12px;font-weight:600;color:var(--urgent);
  margin-bottom:16px;display:flex;align-items:center;gap:4px;
}
.ddl-dot{font-size:8px;}

/* Sub-sections */
.block{margin-bottom:14px;}
.block-hd{
  font-size:12px;font-weight:600;color:var(--text);
  margin-bottom:8px;display:flex;align-items:center;gap:5px;
}
.block-hd .ico{font-size:13px;}

.tri-list{
  list-style:none;display:flex;flex-direction:column;gap:6px;
  padding-left:2px;
}
.tri-list li{
  font-size:13px;line-height:1.65;color:var(--text-2);
  padding-left:14px;position:relative;
}
.tri-list li::before{
  content:"";position:absolute;left:0;top:8px;
  border:4px solid transparent;border-left:5px solid #bdbdbd;
}

/* Memory rows */
.mem-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
.mem-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  font-size:13px;line-height:1.6;color:var(--text-2);
}
.mem-tag{
  flex-shrink:0;font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:10px;
  background:var(--blue-tag-bg);color:var(--blue-tag-text);
  white-space:nowrap;margin-top:2px;
}

/* Recommend box */
.rec-box{
  background:var(--orange-bg);
  border:1px solid rgba(255,152,0,.25);
  border-left:3px solid var(--orange-border);
  border-radius:8px;
  padding:10px 12px;
}
.rec-hd{
  font-size:12px;font-weight:600;color:var(--orange-text);
  margin-bottom:8px;
}
.rec-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.rec-list li{
  font-size:13px;line-height:1.65;color:var(--text);
  padding-left:16px;position:relative;
}
.rec-list li::before{
  content:"→";position:absolute;left:0;color:var(--orange-border);font-weight:700;
}

/* No reason (inline) */
.no-inline{
  display:none;margin-bottom:12px;padding-top:4px;
}
.no-inline.show{display:block;}
.no-label{font-size:12px;color:var(--text-2);margin-bottom:8px;}
.no-chips{display:flex;flex-wrap:wrap;gap:6px;}
.no-chip{
  padding:6px 11px;border-radius:8px;font-size:12px;
  border:1px solid var(--border);background:#fff;
  cursor:pointer;font-family:inherit;color:var(--text);
}
.no-chip:hover{border-color:#999;}
.no-chip.selected{background:var(--btn-dark);color:#fff;border-color:var(--btn-dark);}

/* Actions */
.action-row{
  display:flex;align-items:center;gap:8px;
  margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(229,57,53,.12);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:36px;padding:0 16px;border-radius:10px;
  font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;border:1px solid transparent;
  transition:opacity .15s;
}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-yes{background:var(--btn-dark);color:#fff;}
.btn-yes:hover:not(:disabled){opacity:.88;}
.btn-no{background:#fff;border-color:#d9d9d9;color:var(--text);}
.btn-no:hover:not(:disabled){border-color:#aaa;}
.btn-escalate{
  background:var(--escalate-bg);
  border-color:var(--escalate-border);
  color:var(--escalate-text);
}
.btn-escalate:hover:not(:disabled){background:#e3f2fd;}
.btn svg{flex-shrink:0;}

/* Status */
.status{
  display:none;font-size:13px;line-height:1.55;
  padding:10px 12px;border-radius:10px;margin-bottom:12px;
}
.status.show{display:block;}
.status.ok{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d;}
.status.warn{background:var(--urgent-bg);border:1px solid var(--urgent-border);color:#c62828;}
.status.info{background:var(--escalate-bg);border:1px solid var(--escalate-border);color:var(--escalate-text);}

/* To Do */
.todo-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;margin-bottom:8px;
  transition:border-color .15s,box-shadow .15s;
}
.todo-card:hover{border-color:#ccc;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.todo-card span{font-size:14px;font-weight:500;color:var(--text);}
.todo-card .chev{color:var(--text-3);font-size:16px;}

/* Toast & overlay */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  padding:10px 18px;border-radius:10px;
  background:var(--btn-dark);color:#fff;font-size:13px;font-weight:500;
  opacity:0;transition:.25s;z-index:200;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.3);align-items:center;justify-content:center;padding:20px;
}
.overlay.open{display:flex;}
.dialog{
  background:#fff;border-radius:14px;padding:20px;
  max-width:340px;width:100%;
  box-shadow:0 16px 48px rgba(0,0,0,.12);
}
.dialog h3{font-size:15px;font-weight:600;margin-bottom:8px;}
.dialog p{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px;}
.dialog-btns{display:flex;gap:8px;justify-content:flex-end;}
.dialog-btns button{
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;border:1px solid var(--border);background:#fff;
}
.dialog-btns .primary{background:var(--btn-dark);color:#fff;border-color:var(--btn-dark);}
</style>
</head>
<body>
<div class="page">
  <details class="role-badge" id="roleBadge">
    <summary>
      <span class="role-av">LJ</span>
      <span>卢劲源</span>
      <span style="opacity:.4;font-size:10px">▾</span>
    </summary>
    <div class="role-drop">
      <a class="active" href="D-PAP-WORKER.html">卢劲源 · 运营专员</a>
      <a href="D-PAP-AI-CENTER.html?role=manager&user=u2">金莎拉 · 高阶</a>
    </div>
  </details>

  <div class="scroll">
    <div class="wrap">

      <div class="date-main" id="heroDate"></div>
      <div class="date-day" id="heroDay"></div>

      <p class="brief" id="briefText"></p>

      <div class="sec">Doing</div>

      <div id="statusBox" class="status"></div>

      <article class="doing-card card-in" id="doingCard">
        <div class="card-head">
          <div class="card-title-row">
            <span class="card-emoji">🚨</span>
            <h2 class="card-title" id="taskTitle"></h2>
          </div>
          <span class="card-chevron">›</span>
        </div>
        <div class="ddl-line" id="taskDdl"></div>

        <section class="block">
          <div class="block-hd"><span class="ico">📎</span> CP 原始诉求</div>
          <ul class="tri-list" id="cpList"></ul>
        </section>

        <section class="block">
          <div class="block-hd"><span class="ico">🧠</span> 关联记忆</div>
          <ul class="mem-list" id="memList"></ul>
        </section>

        <section class="block">
          <div class="rec-box">
            <div class="rec-hd" id="recHd"></div>
            <ul class="rec-list" id="recList"></ul>
          </div>
        </section>

        <div class="no-inline" id="noPanel">
          <div class="no-label">请选择不适用原因</div>
          <div class="no-chips" id="noChips"></div>
        </div>

        <div class="action-row" id="actionRow">
          <button type="button" class="btn btn-yes" id="btnYes" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.2l3 3 6-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Yes
          </button>
          <button type="button" class="btn btn-no" id="btnNo" disabled>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            No
          </button>
          <button type="button" class="btn btn-escalate" id="btnEscalate" disabled>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 9V3M3.5 5.5L6 3l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Escalate
          </button>
        </div>
      </article>

      <div class="sec" id="todoLabel">To Do</div>
      <div id="todoList"></div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h3>确认升级？</h3>
    <p>将把当前任务与推荐方案转给高阶同事。确认后的 OUTCOME 将回流写入 Memory。</p>
    <div class="dialog-btns">
      <button type="button" id="ovCancel">取消</button>
      <button type="button" class="primary" id="ovConfirm">确认升级</button>
    </div>
  </div>
</div>

<script>
const USER = { name: '卢劲源', greeting: '上午好' };

const TASKS = [
  {
    title: 'CP「逃离校园」紧急道具补偿',
    ddl: 'DDL · 今日 18:00 · 5h 后过期',
    cp: [
      '成就「合成大师」「极限操作」未正常触发，影响约 153 名玩家',
      '玩家急需「合成卡」补偿，活动今晚 23:59 截止',
      'CP 要求今日内完成道具发放并同步技术排查',
    ],
    memories: [
      { text: '5/12 同类成就未触发，已按 BRAIN-DOC 补发合成卡', tag: 'memory · 钉钉' },
      { text: '4/28 紧急补偿流程：先发放后排查', tag: 'memory · CS-Agent' },
    ],
    brainDoc: 'BRAIN-DOC CS-PB-014',
    actions: [
      '批准向 153 名玩家发放合成卡（批次 ID 由系统自动生成）',
      '同步技术值班排查成就触发逻辑，2h 内回传根因',
    ],
    noReasons: ['补偿范围有误', '需技术先确认', '应升级处理'],
    todos: [
      { title: 'wasm 配置错误调查 · G2Q4EX1V2' },
      { title: 'CP 活动规则澄清 · 待派单' },
    ],
  },
  {
    title: 'VividArmy 台湾区充值异常',
    ddl: 'DDL · 今日 20:00 · 7h 后过期',
    cp: [
      'CP 反馈台湾区多笔充值失败，用户情绪激烈',
      '需 30 分钟内给出处理结论并回复群',
    ],
    memories: [
      { text: '2026-03 台湾通道 timeout 切换备用通道已验证', tag: 'memory · CS-Agent' },
    ],
    brainDoc: 'BRAIN-DOC OPS-TW-003',
    actions: [
      '核对近 2h 失败订单按错误码分组',
      'timeout 占比 &gt; 60% 时切换备用通道并通知 CP 重试',
    ],
    noReasons: ['数据未齐', '需技术介入'],
    todos: [],
  },
];

let taskIdx = 0;
let resolved = false;
const $ = id => document.getElementById(id);

function setDate(){
  const n = new Date();
  const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  $('heroDate').textContent =
    `${n.getFullYear()}年${String(n.getMonth()+1).padStart(2,'0')}月${String(n.getDate()).padStart(2,'0')}日`;
  $('heroDay').textContent = days[n.getDay()];
  const h = n.getHours();
  const greet = h < 12 ? '上午好' : h < 18 ? '下午好' : '晚上好';
  const total = TASKS.length;
  $('briefText').innerHTML =
    `${greet}，<strong>${USER.name}</strong>。Agent 刚在运营群中拆解完今日可执行任务，结合 <strong>memory + brain-doc</strong> 交叉比对后识别出 <strong>${total} 项</strong>任务，其中 <strong>1 项</strong>需你在今日优先确认。`;
}
setDate();

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function status(type, text){
  const s = $('statusBox');
  if(!text){ s.className = 'status'; return; }
  s.className = 'status show ' + type;
  s.textContent = text;
}

function setBtns(on){
  $('btnYes').disabled = !on;
  $('btnNo').disabled = !on;
  $('btnEscalate').disabled = !on;
}

function renderTask(idx){
  const t = TASKS[idx];
  if(!t) return;
  resolved = false;
  status();
  $('noPanel').classList.remove('show');
  $('doingCard').classList.remove('resolved');

  $('taskTitle').textContent = t.title;
  $('taskDdl').innerHTML = `<span class="ddl-dot">●</span> ${t.ddl}`;

  $('cpList').innerHTML = t.cp.map(c => `<li>${c}</li>`).join('');
  $('memList').innerHTML = t.memories.map(m => `
    <li class="mem-row">
      <span>${m.text}</span>
      <span class="mem-tag">${m.tag}</span>
    </li>`).join('');

  $('recHd').textContent = `推荐动作 · 引用 ${t.brainDoc}`;
  $('recList').innerHTML = t.actions.map(a => `<li>${a}</li>`).join('');

  $('noChips').innerHTML = t.noReasons.map(r =>
    `<button type="button" class="no-chip" data-r="${r}">${r}</button>`).join('');

  const todos = t.todos;
  $('todoLabel').textContent = `To Do · ${todos.length}`;
  $('todoList').innerHTML = todos.length
    ? todos.map(x => `
      <div class="todo-card">
        <span>${x.title}</span>
        <span class="chev">›</span>
      </div>`).join('')
    : '';

  setBtns(true);
}

$('btnYes').onclick = () => {
  if(resolved) return;
  resolved = true;
  setBtns(false);
  status('ok', '已确认。Agent 将执行推荐动作，完成后自动进入下一项。');
  toast('方案已确认');
  setTimeout(() => {
    taskIdx++;
    if(taskIdx < TASKS.length) renderTask(taskIdx);
    else {
      $('doingCard').classList.add('resolved');
      status('ok', '今日待确认任务已全部处理完毕。');
      $('actionRow').style.display = 'none';
    }
  }, 1200);
};

$('btnNo').onclick = () => $('noPanel').classList.toggle('show');

$('noChips').onclick = e => {
  const chip = e.target.closest('.no-chip');
  if(!chip || resolved) return;
  resolved = true;
  setBtns(false);
  $('noPanel').classList.remove('show');
  status('warn', `已记录：${chip.dataset.r}。Agent 将重新生成推荐动作。`);
  toast('已提交');
  setTimeout(() => {
    status();
    resolved = false;
    renderTask(taskIdx);
  }, 1800);
};

$('btnEscalate').onclick = () => { if(!resolved) $('overlay').classList.add('open'); };
$('ovCancel').onclick = () => $('overlay').classList.remove('open');
$('ovConfirm').onclick = () => {
  $('overlay').classList.remove('open');
  resolved = true;
  setBtns(false);
  status('info', '已升级至高阶同事，OUTCOME 确认后将写入 Memory。');
  toast('已升级');
};

document.addEventListener('click', e => {
  if(!$('roleBadge').contains(e.target)) $('roleBadge').removeAttribute('open');
});

renderTask(0);
</script>
</body>
</html>
