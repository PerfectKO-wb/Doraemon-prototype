<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Expert · JE Review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #f9fafb;
    --bg-container: #ffffff;
    --bg-hover: #f5f5f4;
    --bg-active: #efefef;
    --bg-subtle: #f5f6f7;
    --border-divider: #e5e7eb;
    --border-default: #d9d9d9;
    --text-default: #131825;
    --text-secondary: #73726e;
    --text-tertiary: #9a9a98;
    --text-disabled: #ababa9;
    --white: #ffffff;
    --primary: #1c64f2;
    --error: #f5222d;
    --error-bg: #fff1f0;
    --error-border: #ffa39e;
    --success: #15803d;
    --success-bg: #ecfdf5;
    --success-border: #a7f3d0;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; color: var(--text-default); background: var(--bg-base); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }

  .app { display: flex; width: 100vw; height: 100vh; }

  /* ===== LEFT NAV SIDEBAR ===== */
  .sidebar {
    width: 200px; flex-shrink: 0;
    display: flex; flex-direction: column;
    height: 100vh;
    background: var(--bg-container);
    border-right: 1px solid var(--border-divider);
  }
  .sidebar-top {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--border-divider);
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-mark {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    display: grid; place-items: center; color: #fff;
  }
  .logo-mark svg { width: 13px; height: 13px; }
  .logo-text { font-family: 'Urbanist', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .sidebar-collapse {
    width: 28px; height: 28px; border: none; background: none;
    border-radius: 6px; cursor: pointer;
    display: grid; place-items: center; color: var(--text-secondary);
  }
  .sidebar-collapse:hover { background: var(--bg-hover); }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #e2e2df; border-radius: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px;
    border-radius: 8px; cursor: pointer;
    color: var(--text-default); font-size: 13px;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-secondary); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; }
  .nav-item.active { background: var(--bg-active); }
  .nav-section {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px 6px;
    font-size: 11px; font-weight: 500; color: var(--text-disabled); letter-spacing: 0.3px;
  }
  .agent-dot {
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .agent-dot.f { background: linear-gradient(135deg, #5ec6d0 0%, #3ba5b0 100%); }
  .agent-dot.tech { background: #1c64f2; }
  .nav-section .section-actions { display: flex; gap: 4px; }
  .nav-section .section-actions button {
    background: none; border: none; cursor: pointer; padding: 3px;
    border-radius: 4px; color: var(--text-tertiary); display: grid; place-items: center;
  }
  .nav-section .section-actions button:hover { background: var(--bg-hover); color: var(--text-secondary); }
  .nav-section .section-actions svg { width: 13px; height: 13px; }
  .sidebar-bottom {
    border-top: 1px solid var(--border-divider); padding: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 14px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    display: grid; place-items: center;
    color: #fff; font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 500; line-height: 16px; }
  .user-role { font-size: 11px; color: var(--text-secondary); line-height: 14px; }
  .user-more {
    width: 28px; height: 28px; border: none; background: none;
    border-radius: 6px; cursor: pointer;
    display: grid; place-items: center; color: var(--text-secondary);
  }
  .user-more:hover { background: var(--bg-hover); }

  /* ===== MIDDLE LIST PANEL ===== */
  .list-panel {
    width: 320px; flex-shrink: 0;
    display: flex; flex-direction: column;
    height: 100vh;
    background: var(--bg-container);
    border-right: 1px solid var(--border-divider);
  }
  .list-panel-header { padding: 10px 16px 14px; border-bottom: 1px solid var(--border-divider); }
  .expert-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .expert-avatar {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, #5ec6d0 0%, #3ba5b0 100%);
    display: grid; place-items: center; flex-shrink: 0;
    color: #fff; font-size: 20px; font-weight: 700; font-family: 'Urbanist', sans-serif;
  }
  .expert-title-col { flex: 1; min-width: 0; }
  .expert-title { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; line-height: 24px; }
  .avatar-stack { display: flex; align-items: center; margin-top: 4px; }
  .avatar-chip {
    width: 22px; height: 22px; border-radius: 11px;
    border: 1.5px solid #fff; margin-left: -6px;
    display: grid; place-items: center;
    color: #fff; font-size: 10px; font-weight: 600; flex-shrink: 0;
  }
  .avatar-chip:first-child { margin-left: 0; }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: none; background: none; border-radius: 8px;
    color: var(--text-secondary); cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-default); }
  .icon-btn svg { width: 18px; height: 18px; }
  .list-filter-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .chip {
    height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--border-default); background: var(--bg-container);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--text-default); cursor: pointer;
  }
  .chip:hover { background: var(--bg-hover); }
  .chip.solid { background: #111827; border-color: #111827; color: #fff; font-weight: 600; }
  .search-row {
    margin-top: 10px; height: 34px; padding: 0 10px;
    border: 1px solid var(--border-default); border-radius: 8px;
    display: flex; align-items: center; gap: 8px; background: var(--bg-container);
  }
  .search-row svg { width: 14px; height: 14px; color: var(--text-disabled); flex-shrink: 0; }
  .search-row input {
    flex: 1; border: none; outline: none; font-family: inherit;
    font-size: 13px; color: var(--text-default); background: transparent;
  }
  .search-row input::placeholder { color: var(--text-disabled); }
  .list-count { font-size: 12px; color: var(--text-secondary); padding: 10px 16px 6px; }
  .list-count strong { color: var(--text-default); font-weight: 700; }
  .list-body { flex: 1; overflow-y: auto; }
  .list-body::-webkit-scrollbar { width: 4px; }
  .list-body::-webkit-scrollbar-thumb { background: #e2e2df; border-radius: 2px; }
  .list-card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; cursor: pointer; position: relative;
  }
  .list-card.nav-card { padding: 8px 16px; align-items: center; }
  .list-card.nav-card .list-card-icon { width: 32px; height: 32px; border-radius: 8px; }
  .list-card.nav-card .list-card-icon svg { width: 16px; height: 16px; }
  .list-card.session-card { padding: 14px 16px; }
  .list-card + .list-card { border-top: 1px solid var(--border-divider); }
  .list-card:hover { background: var(--bg-hover); }
  .list-card.active { background: var(--bg-active); }
  .list-card-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--bg-subtle); display: grid; place-items: center;
    color: var(--text-secondary); flex-shrink: 0;
  }
  .list-card-icon svg { width: 20px; height: 20px; }
  .list-card-content { flex: 1; min-width: 0; }
  .list-card-title {
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 600; line-height: 20px;
  }
  .list-card-title .chev { width: 14px; height: 14px; color: var(--text-disabled); }
  .list-card-desc { font-size: 12px; line-height: 18px; color: var(--text-secondary); margin-top: 2px; }
  .list-card-meta {
    font-size: 11px; color: var(--text-disabled); margin-top: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .list-card-meta svg { width: 12px; height: 12px; }
  .list-card-dot {
    position: absolute; top: 18px; right: 16px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn);
  }
  .je-conf-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn);
    margin-top: 5px;
  }
  .je-conf-badge.low { background: var(--error-bg); border-color: var(--error-border); color: var(--error); }
  .je-conf-badge.high { background: var(--success-bg); border-color: var(--success-border); color: var(--success); }
  .list-section-label {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 6px;
    font-size: 11px; font-weight: 600;
    color: var(--text-disabled); letter-spacing: 0.4px;
    text-transform: uppercase;
    border-top: 1px solid var(--border-divider);
    margin-top: 4px;
  }
  .list-section-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px;
    background: var(--warn); color: #fff;
    border-radius: 8px; font-size: 10px; font-weight: 700;
  }

  /* ===== MAIN CHAT AREA ===== */
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .chat-header {
    height: 52px; flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-divider);
    background: var(--bg-container);
  }
  .chat-header-badge {
    flex-shrink: 0;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 4px;
    border: 1.5px solid var(--warn); color: var(--warn);
    background: transparent;
    text-transform: uppercase;
  }
  .chat-header-badge.confirmed { border-color: var(--success); color: var(--success); }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-title { font-size: 14px; font-weight: 700; color: var(--text-default); text-align: center; }
  .chat-header-sub { font-size: 11px; color: var(--text-tertiary); text-align: center; margin-top: 1px; }
  .chat-header-actions { display: flex; gap: 6px; align-items: center; }
  .hdr-btn {
    height: 30px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border-default); background: #fff; color: var(--text-secondary);
  }
  .hdr-btn:hover { background: var(--bg-hover); color: var(--text-default); }
  .hdr-btn svg { width: 13px; height: 13px; }

  /* ===== CHAT THREAD ===== */
  .chat-thread { flex: 1; overflow-y: auto; padding: 16px 28px 24px; display: flex; flex-direction: column; gap: 0; }
  .chat-thread::-webkit-scrollbar { width: 6px; }
  .chat-thread::-webkit-scrollbar-thumb { background: #e2e2df; border-radius: 3px; }

  .msg-divider {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; color: var(--text-tertiary); font-weight: 500;
    letter-spacing: 0.3px; margin: 8px 0;
  }
  .msg-divider::before, .msg-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border-divider);
  }

  /* Bot message */
  .msg-bot { display: flex; align-items: flex-start; gap: 10px; padding: 14px 0; }
  .msg-bot-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #5ec6d0 0%, #3ba5b0 100%);
    display: grid; place-items: center; color: #fff;
    margin-top: 1px;
  }
  .msg-bot-avatar svg { width: 17px; height: 17px; }
  .msg-bot-body { flex: 1; min-width: 0; max-width: 720px; }
  .msg-bot-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .msg-bot-name { font-size: 13px; font-weight: 700; color: var(--text-default); }
  .msg-time { font-size: 12px; color: var(--text-tertiary); }
  .msg-bubble { font-size: 13.5px; line-height: 1.7; color: var(--text-default); word-break: break-word; }
  .msg-bubble p { margin: 0 0 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .md-hr { border: none; border-top: 1px solid var(--border-divider); margin: 8px 0; }
  .md-heading { font-size: 13.5px; font-weight: 700; margin: 0 0 8px; color: var(--text-default); }
  .md-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0 10px; }
  .md-table th { text-align: left; padding: 4px 10px 4px 0; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-divider); white-space: nowrap; }
  .md-table td { padding: 5px 10px 5px 0; vertical-align: top; border-bottom: 1px solid var(--bg-hover); }
  .md-table tr:last-child td { border-bottom: none; }
  .md-tag { display: inline-block; font-size: 11px; background: var(--bg-subtle); border: 1px solid var(--border-divider); border-radius: 4px; padding: 1px 6px; font-family: monospace; }
  .md-tag.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }

  /* JE draft card inside chat */
  .je-draft-msg {
    border: 1px solid var(--border-divider); border-radius: 10px;
    overflow: hidden; margin-top: 10px;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .je-draft-head {
    padding: 10px 14px;
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    display: flex; align-items: center; gap: 8px; color: #fff;
  }
  .je-draft-head svg { width: 14px; height: 14px; flex-shrink: 0; }
  .je-draft-head-title { font-size: 13px; font-weight: 600; }
  .je-draft-head-id { font-size: 11px; opacity: 0.9; margin-left: auto; font-family: monospace; }
  .je-draft-head.confirmed-head { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  .je-meta-row {
    display: flex; padding: 10px 14px; gap: 0;
    border-bottom: 1px solid var(--border-divider);
  }
  .je-meta-col { flex: 1; }
  .je-meta-col + .je-meta-col { border-left: 1px solid var(--border-divider); padding-left: 14px; }
  .je-meta-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }
  .je-meta-val { font-size: 12px; font-weight: 600; color: var(--text-default); }
  .je-lines-table { width: 100%; }
  .je-lines-head {
    display: flex; padding: 6px 14px;
    background: var(--bg-subtle); border-bottom: 1px solid var(--border-divider);
    font-size: 11px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .je-lines-row {
    display: flex; padding: 8px 14px; align-items: center;
    border-bottom: 1px solid var(--border-divider); gap: 0;
    font-size: 12px;
  }
  .je-lines-row:last-child { border-bottom: none; }
  .je-col-no { width: 28px; flex-shrink: 0; color: var(--text-tertiary); font-size: 11px; }
  .je-col-acct { width: 110px; flex-shrink: 0; font-family: monospace; font-size: 12px; }
  .je-col-name { flex: 1; min-width: 0; color: var(--text-secondary); }
  .je-col-dr { width: 100px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; color: #1d4ed8; }
  .je-col-cr { width: 100px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; color: #7c3aed; }
  .je-conf-row {
    padding: 8px 14px; background: var(--warn-bg);
    border-top: 1px solid var(--warn-border);
    font-size: 12px; color: var(--warn);
    display: flex; align-items: flex-start; gap: 7px;
  }
  .je-conf-row svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
  .je-draft-footer {
    padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-subtle); border-top: 1px solid var(--border-divider);
  }
  .je-footer-mention { font-size: 12px; color: var(--primary); font-weight: 500; }
  .je-footer-date { font-size: 11px; color: var(--text-tertiary); }

  /* message actions */
  .msg-actions-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .msg-quick-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--border-default); background: #fff;
    color: var(--text-default); transition: all 0.15s; cursor: pointer;
  }
  .msg-quick-btn:hover { background: var(--bg-hover); border-color: #999; }
  .msg-quick-btn.confirm-btn { background: #131825; color: #fff; border-color: #131825; }
  .msg-quick-btn.confirm-btn:hover { background: #2d3748; }
  .msg-quick-btn svg { width: 12px; height: 12px; }

  /* User message */
  .msg-user { display: flex; justify-content: flex-end; align-items: flex-end; gap: 8px; padding: 10px 0; }
  .msg-user-bubble {
    max-width: 520px; padding: 10px 14px;
    background: #131825; color: #fff;
    border-radius: 12px 4px 12px 12px;
    font-size: 13.5px; line-height: 1.6;
  }
  .msg-user-time { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; text-align: right; }

  /* System message */
  .msg-system { display: flex; justify-content: center; padding: 6px 0; }
  .msg-system-bubble {
    padding: 5px 14px; border-radius: 8px;
    background: var(--success-bg); border: 1px solid var(--success-border);
    color: var(--success); font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .msg-system-bubble svg { width: 13px; height: 13px; }
  .msg-system-bubble.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
  .msg-system-bubble.info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

  /* mention highlight */
  .mention { color: var(--primary); font-weight: 500; }
  .inline-code { font-family: monospace; background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  /* ===== CHAT INPUT ===== */
  .chat-input-wrap {
    flex-shrink: 0;
    padding: 12px 24px 20px;
    background: var(--bg-container);
  }
  .chat-input-box {
    border: 1px solid var(--border-default);
    border-radius: 14px;
    background: var(--bg-subtle);
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .chat-input-box:focus-within {
    border-color: #131825;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(19,24,37,0.06);
  }
  .chat-input-textarea {
    width: 100%; resize: none; border: none; outline: none;
    background: transparent;
    padding: 12px 16px 0;
    font-size: 14px; font-family: inherit; line-height: 1.5;
    color: var(--text-default); min-height: 44px; max-height: 140px;
  }
  .chat-input-textarea::placeholder { color: var(--text-disabled); }
  .chat-input-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 10px 16px;
  }
  .chat-input-hints { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
    background: #fff; border: 1px solid var(--border-default);
    color: var(--text-secondary); cursor: pointer;
    transition: all 0.12s;
  }
  .hint-pill:hover { background: var(--bg-active); color: var(--text-default); border-color: #999; }
  .input-send-btn {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--bg-active); border: none; color: var(--text-tertiary);
    display: grid; place-items: center; transition: all 0.15s;
  }

  const summary = linesSnapshot ? s.jeSummary : (s.jeSummary || '');
  const acctDateDisplay = acctDateSnapshot || s.accountingDate;
  const jePlainLines = lines.map(ln => {
    if (ln.dr) return `Dr.  ${ln.acctName} [${ln.acctCode}]   ¥${ln.dr}`;
    if (ln.cr) return `    Cr.  ${ln.acctName} [${ln.acctCode}]   ¥${ln.cr}`;
    return '';
  }).join('\n');
  const jePlainText = jePlainLines + (acctDateDisplay ? `\n\nAccounting Date: ${acctDateDisplay}` : '') + (summary ? `\nDescription: ${summary}` : '');

  const confRowHtml = !confirmed ? `
    <div class="je-conf-row" style="border-radius:6px;margin-top:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>${s.aiReason}</span>
    </div>` : '';

  const wrap = document.createElement('div');
  wrap.className = 'msg-bot';
  wrap.innerHTML = `
    ${BOT_AVATAR}
    <div class="msg-bot-body">
      <div class="msg-bot-meta">
        <span class="msg-bot-name">Xiaobao</span>
        <span class="msg-time">${time}</span>
        ${!confirmed ? `` : ''}
      </div>
      <div class="msg-bubble">
        <p>${intro}</p>
        ${iv && !prefixText ? `<hr class="md-hr"><pre style="font-size:12px;line-height:1.8;color:var(--text-secondary);white-space:pre-wrap;word-break:break-all;margin:0 0 4px;">${ivText}</pre>` : ''}
        <hr class="md-hr">
        <p class="md-heading"><span class="md-tag ${!confirmed ? 'warn' : ''}">${headLabel}</span> &nbsp;<span style="font-size:12px;font-weight:400;color:var(--text-tertiary);">${s.id}</span></p>
        <pre style="font-size:13px;line-height:2;color:var(--text-default);white-space:pre-wrap;margin:6px 0 0;font-family:inherit;">${jePlainText}</pre>
        <p style="font-size:11px;color:var(--text-tertiary);margin-top:8px;">${mentionStr} 请审核，确认无误后回复「确认」提交。</p>
      </div>
    </div>`;
  return wrap;
}

function buildJeTableMsg(m, time) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-bot';
  const thStyle = 'padding:6px 10px;background:#f5f6f7;border:1px solid #e5e7eb;font-size:11px;font-weight:600;color:#73726e;white-space:nowrap;text-align:left;';
  const tdStyle = 'padding:5px 10px;border:1px solid #e5e7eb;font-size:11px;color:#131825;white-space:nowrap;';
  const tdMuted = 'padding:5px 10px;border:1px solid #e5e7eb;font-size:11px;color:#9a9a98;white-space:nowrap;';
  const headers = ['Company Code','Region','Accounting Date','Description','Report Name','Account Code','Debit','Credit'];
  const thead = `<thead><tr>${headers.map(h => `<th style="${thStyle}">${h}</th>`).join('')}</tr></thead>`;

  // Split rows into groups
  const groups = [];
  let current = null;
  m.rows.forEach(r => {
    if (r.group) { current = { label: r.group, rows: [] }; groups.push(current); }
    if (current) current.rows.push(r);
  });

  const tablesHtml = groups.map((g, gi) => {
    const bodyRows = g.rows.map((r, i) => `<tr>
      <td style="${i === 0 ? tdStyle : tdMuted}">${i === 0 ? (m.company || '—') : ''}</td>
      <td style="${i === 0 ? tdStyle : tdMuted}">${i === 0 ? (m.region || '—') : ''}</td>
      <td style="${tdStyle}">${r.accountingDate}</td>
      <td style="${tdStyle}">${r.description}</td>
      <td style="${tdStyle}">${r.reportName}</td>
      <td style="${tdStyle};font-family:monospace;">${r.accountCode}</td>
      <td style="${tdStyle};text-align:right;font-variant-numeric:tabular-nums;">${r.debit}</td>
      <td style="${tdStyle};text-align:right;font-variant-numeric:tabular-nums;">${r.credit}</td>
    </tr>`).join('');
    return `<p style="font-size:11px;font-weight:600;color:#131825;margin:${gi === 0 ? '10px' : '16px'} 0 4px;">${g.label}</p>
    <div style="overflow-x:auto;">
      <table style="border-collapse:collapse;min-width:100%;">${thead}<tbody>${bodyRows}</tbody></table>
    </div>`;
  }).join('');

  wrap.innerHTML = `${BOT_AVATAR}
    <div class="msg-bot-body">
      <div class="msg-bot-meta"><span class="msg-bot-name">Xiaobao</span><span class="msg-time">${time}</span></div>
      <div class="msg-bubble">
        <p>${m.intro || ''}</p>
        ${tablesHtml}
        <p style="font-size:11px;color:var(--text-tertiary);margin-top:10px;">确认无误后点击提交。</p>
        <button onclick="document.getElementById('chatInput').value='确认';document.getElementById('chatInput').dispatchEvent(new Event('input'));document.getElementById('sendBtn').click();" style="margin-top:8px;height:32px;padding:0 16px;border-radius:8px;background:#131825;color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;">确认</button>
      </div>
    </div>`;
  return wrap;
}

function buildBotMsg(text, time) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-bot';
  const htmlText = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/@([\w.@+\u3040-\u30ff\u4e00-\u9fa5]+)/g, '<span class="mention">@$1</span>')
    .replace(/`([^`]+)`/g, '<span class="inline-code">$1</span>');
  wrap.innerHTML = `${BOT_AVATAR}
    <div class="msg-bot-body">
      <div class="msg-bot-meta"><span class="msg-bot-name">Xiaobao</span><span class="msg-time">${time}</span></div>
      <div class="msg-bubble">${htmlText}</div>
    </div>`;
  return wrap;
}

function buildUserMsg(text, time) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-user';
  const htmlText = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  wrap.innerHTML = `<div>
    <div class="msg-user-time">${time}</div>
    <div class="msg-user-bubble">${htmlText}</div>
  </div>`;
  return wrap;
}

function buildSystemMsg(text, type) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-system';
  const iconMap = {
    success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`,
    info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>`
  };
  const htmlText = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  wrap.innerHTML = `<div class="msg-system-bubble ${type !== 'success' ? type : ''}">
    ${iconMap[type] || iconMap.success} ${htmlText}
  </div>`;
  return wrap;
}

// ========== RENDER THREAD ==========
function renderThread() {
  const s = activeSession();
  const thread = document.getElementById('chatThread');
  thread.innerHTML = '';

  s.messages.forEach(m => {
    if (m.type === 'je-draft-card') {
      thread.appendChild(buildJeDraftCardMsg(s, m.time, m.prefixText, m.linesSnapshot, m.acctDateSnapshot));
    } else if (m.type === 'je-split-table') {
      thread.appendChild(buildJeTableMsg(m, m.time));
    } else if (m.role === 'bot') {
      thread.appendChild(buildBotMsg(m.text, m.time));
    } else if (m.role === 'user') {
      thread.appendChild(buildUserMsg(m.text, m.time));
    } else if (m.role === 'system') {
      thread.appendChild(buildSystemMsg(m.text, m.type || 'success'));
    }
  });

  const typing = document.createElement('div');
  typing.className = 'msg-bot'; typing.id = 'typingIndicator'; typing.style.display = 'none';
  typing.innerHTML = `<div class="msg-bot-avatar" style="background:linear-gradient(135deg,#5ec6d0,#3ba5b0);"></div>
    <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  thread.appendChild(typing);

  thread.scrollTop = thread.scrollHeight;
}

// ========== RENDER DETAIL PANEL ==========
function renderDetailPanel() {}


// ========== SWITCH SESSION ==========
function switchSession(id) {
  activeSessionId = id;
  const s = activeSession();
  document.getElementById('chatTitle').textContent = s.id;
  const badge = document.getElementById('chatBadge');
  badge.textContent = s.state === 'confirmed' ? '已确认' : 'PENDING';
  badge.className = 'chat-header-badge' + (s.state === 'confirmed' ? ' confirmed' : '');
  renderSessionList();
  renderThread();
  renderDetailPanel();
}

// ========== AI COMMAND PARSER ==========
function parseAndExecute(text) {
  const s = activeSession();
  const lower = text.toLowerCase().trim();

  // Confirm
  if (/^(confirm|lgtm|ok$|approve|confirmed|没问题|确认|提交)/i.test(lower) || lower.includes('confirm') || lower.includes('确认')) {
    return doConfirm(s);
  }

  // Change account code: "第1行 科目代码 → 6060" or "line 1 account code → 6060"
  const acctMatch = text.match(/(?:第\s*(\d+)\s*行|line\s*(\d+))\s*(?:科目代码|account\s*code|acct(?:ount)?)\s*[→\->\s]+\s*(\w+)/i);
  if (acctMatch) {
    return doChangeAccount(s, Number(acctMatch[1] || acctMatch[2]), acctMatch[3].trim());
  }

  // Change accounting date: "入账日期 → 2026-05-31" or "accounting date → 2026-05-31"
  const dateMatch = text.match(/(?:入账日期|accounting\s*date)\s*[→\->\s]+\s*([\d\-\/]+)/i);
  if (dateMatch) {
    return doChangeDate(s, dateMatch[1].trim());
  }

  // Change account name: "第1行 科目名称 → xxx"
  const nameMatch = text.match(/(?:第\s*(\d+)\s*行|line\s*(\d+))\s*(?:科目名称|account\s*name|name)\s*[→\->\s]+\s*(.+)/i);
  if (nameMatch) {
    return doChangeAccountName(s, Number(nameMatch[1] || nameMatch[2]), nameMatch[3].trim());
  }

  // Show lines
  if (lower.includes('show') || lower.includes('lines') || lower.includes('list') || lower.includes('查看') || lower.includes('明细')) {
    return doListLines(s);
  }

  // Default
  return `收到。支持以下操作：\n• 确认分录：\`确认\`\n• 修改科目代码：\`第1行 科目代码 → 6060\`\n• 修改科目名称：\`第1行 科目名称 → 广告宣传费\`\n• 修改入账日期：\`入账日期 → 2026-05-31\`\n• 查看明细：\`查看明细\``;
}

function doConfirm(s) {
  if (s.state === 'confirmed') return { botMsg: '该 JE 已确认，无需重复操作。' };
  s.state = 'confirmed';
  s.confidence = 100;
  s.confidenceLevel = 'high';
  return {
    botMsg: '已将 JE 提交至 F 系统。',
    type: 'success',
    refresh: true
  };
}

function doChangeAccount(s, lineNo, newCode) {
  const line = s.lines.find(l => l.no === lineNo);
  if (!line) return `第 ${lineNo} 行不存在，该草稿共 ${s.lines.length} 行。`;
  if (s.state === 'confirmed') return 'JE 已确认，无法修改。';
  const old = line.acctCode;
  line.acctCode = newCode;
  return {
    updateMsg: `第 ${lineNo} 行科目代码已更新：\`${old}\` → \`${newCode}\`。\n请确认下方更新后的分录，无误后提交。`,
    refresh: true
  };
}

function doChangeAccountName(s, lineNo, newName) {
  const line = s.lines.find(l => l.no === lineNo);
  if (!line) return `第 ${lineNo} 行不存在。`;
  if (s.state === 'confirmed') return 'JE 已确认，无法修改。';
  const old = line.acctName;
  line.acctName = newName;
  return {
    updateMsg: `第 ${lineNo} 行科目名称已更新：\`${old}\` → \`${newName}\`。\n请确认无误后提交。`,
    refresh: true
  };
}

function doChangeDate(s, newDate) {
  if (s.state === 'confirmed') return 'JE 已确认，无法修改。';
  const old = s.accountingDate;
  s.accountingDate = newDate;
  return {
    updateMsg: `入账日期已更新：\`${old}\` → \`${newDate}\`。\n请确认下方更新后的分录，无误后提交。`,
    refresh: true
  };
}

function doListLines(s) {
  const lines = s.lines.map(l => {
    if (l.dr) return `Dr.  ${l.acctName} [${l.acctCode}]   ¥${l.dr}`;
    if (l.cr) return `    Cr.  ${l.acctName} [${l.acctCode}]   ¥${l.cr}`;
    return '';
  }).join('\n');
  return `JE ${s.id} current entries:\n${lines}\n\nAccounting Date: ${s.accountingDate}\nDescription: ${s.jeSummary || ''}`;
}

// ========== SEND MESSAGE ==========
function sendMessage(text) {
  if (!text.trim()) return;
  const s = activeSession();

  s.messages.push({ role: 'user', text, time: nowStr() });
  renderThread();

  setTimeout(() => {
    document.getElementById('typingIndicator').style.display = 'flex';
    document.getElementById('chatThread').scrollTop = 99999;
  }, 100);

  setTimeout(() => {
    document.getElementById('typingIndicator').style.display = 'none';
    const result = parseAndExecute(text);

    if (typeof result === 'string') {
      s.messages.push({ role: 'bot', text: result, time: nowStr() });
    } else if (result) {
      if (result.updateMsg && result.refresh && s.state !== 'confirmed') {
        s.messages.push({
          role: 'bot', type: 'je-draft-card',
          prefixText: result.updateMsg,
          time: nowStr(),
          linesSnapshot: JSON.parse(JSON.stringify(s.lines)),
          acctDateSnapshot: s.accountingDate
        });
      } else {
        if (result.botMsg) s.messages.push({ role: 'bot', text: result.botMsg, time: nowStr() });
        if (result.systemMsg) s.messages.push({ role: 'system', text: result.systemMsg, type: result.type || 'success', time: nowStr() });
        if (result.refresh && s.state === 'confirmed') {
          s.messages.push({ role: 'bot', type: 'je-draft-card', time: nowStr() });
        }
      }
    }

    renderThread();
    if (result?.refresh) {
      renderDetailPanel();
      renderSessionList();
      const badge = document.getElementById('chatBadge');
      if (s.state === 'confirmed') {
        badge.textContent = 'CONFIRMED';
        badge.className = 'chat-header-badge confirmed';
      }
    }
  }, 800);
}

// ========== EVENTS ==========
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('input', () => {
  sendBtn.classList.toggle('active', inputEl.value.trim().length > 0);
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const val = inputEl.value.trim();
    if (val) { sendMessage(val); inputEl.value = ''; sendBtn.classList.remove('active'); inputEl.style.height = 'auto'; }
  }
});
sendBtn.addEventListener('click', () => {
  const val = inputEl.value.trim();
  if (val) { sendMessage(val); inputEl.value = ''; sendBtn.classList.remove('active'); inputEl.style.height = 'auto'; }
});
document.querySelectorAll('.hint-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = btn.dataset.msg;
    inputEl.dispatchEvent(new Event('input'));
    inputEl.focus();
  });
});

// ========== INIT ==========
switchSession(activeSessionId);
</script>
