<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAP — Finance Task Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            background: #e4e6ef;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(200,210,240,.4) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 80% 80%, rgba(190,205,235,.3) 0%, transparent 65%);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ── Desktop Client Window ── */
        .desktop-stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .client-window {
            width: min(960px, 96vw);
            height: min(760px, 92vh);
            background: #f0f1f5;
            border-radius: 16px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.6),
                0 24px 80px rgba(31,38,135,0.18),
                0 8px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .window-titlebar {
            flex-shrink: 0;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 0 14px;
            background: rgba(255,255,255,0.35);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .window-controls span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
        }
        .wc-close  { background: #ff5f57; border: 0.5px solid rgba(0,0,0,0.08); }
        .wc-min    { background: #febc2e; border: 0.5px solid rgba(0,0,0,0.08); }
        .wc-max    { background: #28c840; border: 0.5px solid rgba(0,0,0,0.08); }

        .titlebar-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .titlebar-icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(0,0,0,0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .titlebar-icon-btn:hover {
            background: rgba(0,0,0,0.05);
            color: rgba(0,0,0,0.7);
        }
        .titlebar-icon-btn.active {
            background: rgba(0,0,0,0.07);
            color: rgba(0,0,0,0.78);
        }
        .f-tab-icon {
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.8px solid currentColor;
            border-radius: 3px;
            font-family: inherit;
        }

        .client-tabs {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .tab-panel {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }
        .fsystem-viewport {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #f0f1f3;
        }
        .fsystem-viewport::-webkit-scrollbar { width: 6px; height: 6px; }
        .fsystem-viewport::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.12);
            border-radius: 3px;
        }
        .fsystem-screenshot {
            display: block;
            width: 100%;
            height: auto;
        }
        .fsystem-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(0,0,0,0.35);
            background: #f5f5f7;
        }
        .fsystem-placeholder-icon { font-size: 32px; opacity: 0.5; }
        .fsystem-placeholder-title { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.5); }
        .fsystem-placeholder-desc { font-size: 12px; }

        .titlebar-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ds3-ui-layer {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(120,119,198,0.06) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(59,130,246,0.05) 0%, transparent 50%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 70%),
                linear-gradient(180deg, #f8f9fa 0%, #f0f1f3 100%);
        }

        /* ── User Badge (top-left) ── */
        .user-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 100;
        }
        .user-badge button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 6px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 4px 16px rgba(31,38,135,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
            color: rgba(0,0,0,0.8);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }
        .user-badge button:hover {
            background: rgba(255,255,255,0.5);
            box-shadow: 0 4px 20px rgba(31,38,135,0.1), inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .user-badge .avatar {
            width: 28px; height: 28px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(16,185,129,0.12);
            color: #059669;
            font-size: 10px;
            font-weight: 700;
        }
        .user-badge .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            text-align: left;
        }
        .user-badge .user-name { font-weight: 500; }
        .user-badge .user-role {
            font-size: 10px;
            opacity: 0.45;
            font-weight: 400;
        }
        .user-badge .dropdown-arrow {
            font-size: 10px;
            opacity: 0.4;
        }

        /* ── Scrollable Content ── */
        .scroll-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .scroll-inner {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 50px 40px 40px;
        }
        .scroll-inner::-webkit-scrollbar { width: 6px; }
        .scroll-inner::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
        }

        .content {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── Date ── */
        .date-block {
            margin-bottom: 24px;
        }
        .date-main {
            font-size: 32px;
            font-weight: 800;
            color: rgba(0,0,0,0.85);
            line-height: 1.2;
        }
        .date-sub {
            font-size: 14px;
            font-weight: 500;
            color: rgba(0,0,0,0.35);
            margin-top: 4px;
        }

        /* ── Greeting ── */
        .greeting-line {
            font-size: 16px;
            color: rgba(0,0,0,0.35);
            line-height: 1.9;
            white-space: pre-wrap;
            transition: color 0.6s ease;
        }
        .greeting-line.reminder {
            color: rgba(220,38,38,0.82);
            font-weight: 600;
        }
        .typewriter-cursor {
            display: inline-block;
            width: 2px; height: 16px;
            background: rgba(0,0,0,0.3);
            margin-left: 1px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .reminder-icon {
            flex-shrink: 0;
            font-size: 18px;
            margin-top: 1px;
        }
        .reminder-content { flex: 1; }
        .reminder-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .reminder-desc {
            font-size: 12px;
            line-height: 1.6;
        }

        /* ── Section Label ── */
        .section-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: rgba(0,0,0,0.4);
            margin: 24px 0 12px;
        }
        .section-label:first-child { margin-top: 16px; }

        /* ── Task Cards Container ── */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 0 8px;
        }

        /* ── Task Card ── */
        .task-card {
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 8px 32px rgba(31,38,135,0.08), inset 0 1px 0 rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            cursor: pointer;
            color: inherit;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            transform: translateY(12px);
        }
        .task-card:hover {
            background: rgba(255,255,255,0.65);
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(31,38,135,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .task-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Compact Card ── */
        .task-card.compact {
            padding: 12px 16px;
            gap: 12px;
            border-radius: 16px;
        }
        .task-card.compact .card-icon {
            width: 36px; height: 36px;
            font-size: 18px;
            border-radius: 10px;
        }
        .task-card.compact .card-title {
            font-size: 14px;
            margin-bottom: 2px;
        }
        .task-card.compact .card-desc {
            font-size: 11px;
        }

        /* ── View More Button ── */
        .view-more-btn {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: 1px dashed rgba(0,0,0,0.1);
            border-radius: 12px;
            color: rgba(0,0,0,0.5);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s;
        }
        .view-more-btn:hover {
            background: rgba(0,0,0,0.02);
            color: rgba(0,0,0,0.7);
            border-color: rgba(0,0,0,0.2);
        }

        .task-card .card-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.03);
            font-size: 22px;
        }

        .task-card .card-body {
            flex: 1;
            min-width: 0;
        }
        .task-card .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 3px;
            color: rgba(0,0,0,0.85);
        }
        .task-card .card-desc {
            font-size: 12px;
            color: rgba(0,0,0,0.45);
            line-height: 1.5;
        }

        .card-chevron {
            font-size: 16px;
            color: rgba(0,0,0,0.2);
            flex-shrink: 0;
            transition: transform 0.2s, color 0.2s;
        }
        .task-card:hover .card-chevron {
            color: rgba(0,0,0,0.4);
            transform: translateX(2px);
        }

        /* ── Warning card (yellow – mid-month reminder) ── */
        .task-card.warning {
            border: 1.5px solid rgba(234,179,8,0.5);
            box-shadow: 0 8px 32px rgba(234,179,8,0.10), inset 0 1px 0 rgba(255,255,255,0.5);
            background: rgba(254,252,232,0.55);
        }
        .task-card.warning:hover {
            border-color: rgba(234,179,8,0.65);
            box-shadow: 0 12px 40px rgba(234,179,8,0.15), inset 0 1px 0 rgba(255,255,255,0.6);
            background: rgba(254,252,232,0.75);
        }
        .task-card.warning .card-icon {
            background: rgba(234,179,8,0.08);
        }

        /* ── Urgent card (red – month-end reminder) ── */
        .task-card.urgent {
            border: 1.5px solid rgba(239,68,68,0.5);
            box-shadow: 0 8px 32px rgba(239,68,68,0.10), inset 0 1px 0 rgba(255,255,255,0.5);
            background: rgba(255,245,245,0.5);
        }
        .task-card.urgent:hover {
            border-color: rgba(239,68,68,0.65);
            box-shadow: 0 12px 40px rgba(239,68,68,0.15), inset 0 1px 0 rgba(255,255,255,0.6);
            background: rgba(255,245,245,0.7);
        }
        .task-card.urgent .card-icon {
            background: rgba(239,68,68,0.06);
        }
        .task-card.urgent .card-desc {
            color: rgba(220,38,38,0.75);
            font-weight: 600;
        }

        .card-hint {
            display: none;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .card-hint .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }
        .task-card.warning .card-hint {
            display: inline-flex;
            color: rgba(161,98,7,0.8);
        }
        .task-card.warning .card-hint .dot {
            background: rgba(234,179,8,0.7);
        }
        .task-card.urgent .card-hint {
            display: inline-flex;
            color: rgba(220,38,38,0.75);
        }
        .task-card.urgent .card-hint .dot {
            background: rgba(239,68,68,0.6);
        }

        /* ── Payment task card ── */
        .task-card.payment-task {
            position: relative;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── Success banner (month-end all done) ── */
        .success-banner {
            display: none;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(240,253,244,0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(16,185,129,0.25);
            border-radius: 16px;
            margin: 12px 0 0;
            animation: fadeSlideIn 0.5s ease-out;
        }
        .success-banner.show { display: flex; }
        .success-banner .reminder-content { flex: 1; }
        .success-banner .reminder-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(5,150,105,0.9);
            margin-bottom: 3px;
        }
        .success-banner .reminder-desc {
            font-size: 12px;
            color: rgba(6,95,70,0.7);
            line-height: 1.6;
        }

        /* ── Empty Review State ── */
        .empty-review-card {
            background: rgba(240,253,244,0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(16,185,129,0.22);
            box-shadow: 0 8px 32px rgba(16,185,129,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .empty-review-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .empty-review-icon {
            font-size: 40px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .empty-review-title {
            font-size: 15px;
            font-weight: 700;
            color: rgba(5,150,105,0.9);
            margin-bottom: 6px;
        }
        .empty-review-desc {
            font-size: 13px;
            color: rgba(6,95,70,0.55);
            line-height: 1.7;
        }

        /* Card in all-done state */
        .task-card.all-done {
            border-color: rgba(16,185,129,0.3);
            background: rgba(240,253,244,0.4);
        }
        .task-card.all-done:hover {
            border-color: rgba(16,185,129,0.45);
            background: rgba(240,253,244,0.6);
        }
        .task-card.all-done .card-icon {
            background: rgba(16,185,129,0.08);
        }
        .task-card.all-done .count-number {
            color: rgba(5,150,105,0.85);
        }
        .task-card.all-done .count-label {
            color: rgba(5,150,105,0.5);
        }

        /* ── Test Case Button (bottom-right) ── */
        .fab-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .fab-btn button {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: none;
            box-shadow: 0 8px 32px rgba(31,38,135,0.08), inset 0 1px 0 rgba(255,255,255,0.5);
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .fab-btn button:hover {
            background: rgba(255,255,255,0.8);
            box-shadow: 0 8px 32px rgba(31,38,135,0.14), inset 0 1px 0 rgba(255,255,255,0.7);
        }

        /* ── Test Case Panel ── */
        .test-panel {
            display: none;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 12px 48px rgba(31,38,135,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 280px;
        }
        .test-panel.show { display: block; }
        .test-panel-title {
            font-size: 12px;
            font-weight: 700;
            color: rgba(0,0,0,0.7);
            margin-bottom: 10px;
        }
        .test-btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            background: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 500;
            color: rgba(0,0,0,0.6);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: all 0.15s;
        }
        .test-btn:last-child { margin-bottom: 0; }
        .test-btn:hover {
            background: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.8);
        }
        .test-btn.active {
            background: rgba(79,70,229,0.08);
            border-color: rgba(79,70,229,0.2);
            color: rgba(79,70,229,0.9);
            font-weight: 600;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .desktop-stage { padding: 12px; }
            .client-window { width: 100%; height: 96vh; border-radius: 12px; }
            .scroll-inner { padding: 50px 20px 40px; }
            .date-main { font-size: 26px; }
        }
    </style>
</head>
<body>
<div class="desktop-stage">
<div class="client-window">

    <!-- Window Title Bar -->
    <div class="window-titlebar">
        <div class="titlebar-left">
            <div class="window-controls">
                <span class="wc-close"></span>
                <span class="wc-min"></span>
                <span class="wc-max"></span>
            </div>
            <div class="titlebar-nav">
                <button class="titlebar-icon-btn active" data-tab="home" title="PAP 任务" onclick="switchTab('home')">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
                </button>
                <button class="titlebar-icon-btn" data-tab="apps" title="应用" onclick="switchTab('apps')">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                </button>
                <button class="titlebar-icon-btn" data-tab="fsystem" title="F System · 财务系统" onclick="switchTab('fsystem')">
                    <span class="f-tab-icon">F</span>
                </button>
            </div>
        </div>
        <div class="titlebar-right">
            <button class="titlebar-icon-btn" title="Launch">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M4.5 16.5c10-4 10-4 15-9"/><path d="M12 3l4 4-4 4"/><path d="M5 19h6"/></svg>
            </button>
            <button class="titlebar-icon-btn" title="Settings">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </div>
    </div>

    <div class="client-tabs">
    <div class="tab-panel active" id="tab-home">
    <div class="ds3-ui-layer">
    <!-- User Badge -->
    <div class="user-badge">
        <button>
            <span class="avatar">ZM</span>
            <div class="user-info">
                <span class="user-name">张明</span>
                <span class="user-role">Finance Specialist</span>
            </div>
            <span class="dropdown-arrow">▾</span>
        </button>
    </div>

    <!-- Main Scrollable Area -->
    <div class="scroll-area">
        <div class="scroll-inner">
            <div class="content">
                <!-- Date Block -->
                <div class="date-block">
                    <div class="date-main" id="dateMain"></div>
                    <div class="date-sub" id="dateSub"></div>

                <!-- Greeting Lines -->
                <div class="greeting-line" id="greeting1"></div>
                <div class="greeting-line" id="greeting2"></div>

                <!-- Success Banner (month-end all done only) -->
                <div class="success-banner" id="successBanner">
                    <span class="reminder-icon">✅</span>
                    <div class="reminder-content">
                        <div class="reminder-title" id="successTitle"></div>
                        <div class="reminder-desc" id="successDesc"></div>
                    </div>

                <!-- Task Cards -->
                <div id="taskList"></div>

</div><!-- /ds3-ui-layer -->

    <div class="tab-panel" id="tab-fsystem">
        <div class="fsystem-viewport">
            <img class="fsystem-screenshot" src="figma-fsystem-invoice.png" alt="F System · Invoice 管理">

        <div class="fsystem-placeholder">

<!-- Test Case FAB (desktop background) -->
<div class="fab-btn">
    <div class="test-panel" id="testPanel">
        <div class="test-panel-title">🧪 按类别付款提醒</div>
        <button class="test-btn active" data-scenario="no-remind" onclick="simulateDate('no-remind')">5 月初 · 无提醒</button>
        <button class="test-btn" data-scenario="remind-tech" onclick="simulateDate('remind-tech')">🔴 技术服务费 · 次月初</button>
        <button class="test-btn" data-scenario="remind-cp_rs" onclick="simulateDate('remind-cp_rs')">🔴 CP / RS · 次月中</button>
        <button class="test-btn" data-scenario="remind-ip_ad" onclick="simulateDate('remind-ip_ad')">🔴 IP / 广告费 · 次月末</button>
    </div>
    <button onclick="toggleTestPanel()">🧪 测试用例</button>
</div>

</div><!-- /desktop-stage -->

<script>
    const today = new Date();
    const dayOfMonth = today.getDate();
    const month = today.getMonth();
    const year = today.getFullYear();
    const weekDays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const monthNames = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    const monthNamesEn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const currentUser = '张明';

    // ── Mock Data ──

    // 待审核：所有财务可见
    const pendingInvoices = [
        { id: 'INV-2026-04-001', account: 'エムスリーキャリア株式会社', amount: '33,000', currency: 'JPY' },
        { id: 'INV-2026-04-002', account: '株式会社リクルート', amount: '128,700', currency: 'JPY' },
        { id: 'INV-2026-04-003', account: 'AWS Japan 合同会社', amount: '456,200', currency: 'JPY' },
    ];

    function monthKeyFromDate(y, m) {
        return `${y}-${monthNames[m]}`;
    }

    function monthLabelFromDate(m) {
        return monthNamesEn[m];
    }

    /** 次月付款提醒节点（同一月度 Payment 任务在不同时段展示不同提醒） */
    const PAYMENT_REMINDERS = {
        tech: {
            normalDesc: 'Invoices pending payment',
            reminderDesc: 'Technical service fees due at the beginning of this month — please complete soon',
            greetingText: 'Reminder: Technical service fees are due at the beginning of this month — please complete payment.',
        },
        cp_rs: {
            normalDesc: 'Invoices pending payment',
            reminderDesc: 'CP & RS payments due mid-month — please complete soon',
            greetingText: 'Reminder: CP & RS payments are due mid-month — please complete payment soon.',
        },
        ip_ad: {
            normalDesc: 'Invoices pending payment',
            reminderDesc: 'IP & advertising fees due at month-end — please complete soon',
            greetingText: 'Reminder: IP & advertising fees are due at month-end — please complete payment soon.',
        },
    };

    const demoTaskMonth = month === 0 ? 11 : month - 1;
    const demoTaskYear = month === 0 ? year - 1 : year;
    const demoTaskKey = monthKeyFromDate(demoTaskYear, demoTaskMonth);

    /** 打款任务：每月仅一条（F Expert approve 后创建） */
    let paymentTasks = [
        {
            id: `pay-${demoTaskKey}`,
            monthKey: demoTaskKey,
            monthLabel: monthLabelFromDate(demoTaskMonth),
            reviewer: '张明',
            invoiceCount: 5,
            consumed: false,
            consumedBy: null,
        },
    ];

    function getDueMonth(task) {
        const [ty, tm] = task.monthKey.split('-').map(Number);
        const taskMonthIdx = tm - 1;
        let dueMonth = taskMonthIdx + 1;
        let dueYear = ty;
        if (dueMonth > 11) {
            dueMonth = 0;
            dueYear += 1;
        }
        return { dueYear, dueMonth };
    }

    function getPaymentReminderPhase(simYear, simMonth, simDay, task, scenario) {
        if (scenario === 'remind-tech') return 'tech';
        if (scenario === 'remind-cp_rs') return 'cp_rs';
        if (scenario === 'remind-ip_ad') return 'ip_ad';

        const { dueYear, dueMonth } = getDueMonth(task);
        if (simYear !== dueYear || simMonth !== dueMonth) return null;

        const lastDay = getLastDayOfMonth(dueYear, dueMonth);
        if (simDay >= 1 && simDay < 15) return 'tech';
        if (simDay >= 15 && simDay < lastDay) return 'cp_rs';
        if (simDay >= lastDay) return 'ip_ad';
        return null;
    }

    function getPaymentReminderState(task, simYear, simMonth, simDay, scenario) {
        const phase = getPaymentReminderPhase(simYear, simMonth, simDay, task, scenario);
        if (!phase) {
            return { isReminder: false, desc: PAYMENT_REMINDERS.tech.normalDesc, greetingText: null };
        }
        const info = PAYMENT_REMINDERS[phase];
        return {
            isReminder: true,
            desc: info.reminderDesc,
            greetingText: info.greetingText,
        };
    }

    function getLastDayOfMonth(y, m) {
        return new Date(y, m + 1, 0).getDate();
    }

    function ensurePaymentTask(taskYear, taskMonthIdx) {
        const key = monthKeyFromDate(taskYear, taskMonthIdx);
        paymentTasks = [{
            id: `pay-${key}`,
            monthKey: key,
            monthLabel: monthLabelFromDate(taskMonthIdx),
            reviewer: currentUser,
            invoiceCount: 5,
            consumed: false,
            consumedBy: null,
        }];
    }

    /** 次月 15 号及之后自动消费 */
    function shouldAutoConsume(task, simYear, simMonth, simDay) {
        const [ty, tm] = task.monthKey.split('-').map(Number);
        let autoYear = ty;
        let autoMonth = tm; // 1-based → next month 1-based
        if (autoMonth === 12) {
            autoMonth = 1;
            autoYear += 1;
        } else {
            autoMonth += 1;
        }
        const autoMonthIdx = autoMonth - 1;
        if (simYear > autoYear) return true;
        if (simYear < autoYear) return false;
        if (simMonth > autoMonthIdx) return true;
        if (simMonth === autoMonthIdx && simDay >= 15) return true;
        return false;
    }

    function resolvePaymentTasks(simYear, simMonth, simDay, skipAutoConsume) {
        if (!skipAutoConsume) {
            paymentTasks.forEach(task => {
                if (task.reviewer !== currentUser || task.consumed) return;
                if (shouldAutoConsume(task, simYear, simMonth, simDay)) {
                    task.consumed = true;
                    task.consumedBy = 'auto';
                }
            });
        }
        return paymentTasks.filter(t => t.reviewer === currentUser && !t.consumed);
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + tabId)?.classList.add('active');
        document.querySelectorAll('.titlebar-nav .titlebar-icon-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabId);
        });
    }

    function goToFSystem(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        switchTab('fsystem');
    }

    // ── Render Date ──
    document.getElementById('dateMain').textContent =
        `${monthNames[month]}/${String(dayOfMonth).padStart(2,'0')}/${year}`;
    document.getElementById('dateSub').textContent = weekDays[today.getDay()];

    // ── Typewriter ──
    function typewrite(el, text, delay) {
        return new Promise(resolve => {
            setTimeout(() => {
                let i = 0;
                el.innerHTML = '';
                function tick() {
                    if (i < text.length) {
                        el.innerHTML = text.slice(0, i + 1) + '<span class="typewriter-cursor"></span>';
                        i++;
                        setTimeout(tick, 25 + Math.random() * 15);
                    } else {
                        el.textContent = text;
                        resolve();
                    }
                }
                tick();
            }, delay);
        });
    }

    // ── Greeting ──
    function getGreetingText(pendingReviewCount, pendingPaymentCount, activePaymentTasks, simYear, simMonth, simDay, scenario) {
        const task = activePaymentTasks?.[0];
        if (task) {
            const reminder = getPaymentReminderState(task, simYear, simMonth, simDay, scenario);
            if (reminder.isReminder) return reminder.greetingText;
        }
        return `Hi, here are your tasks today: ${pendingReviewCount} pending review, ${pendingPaymentCount} pending payment.`;
    }

    typewrite(document.getElementById('greeting1'), 'Hi 👋', 200)
        .then(() => {
            const pendingReviewCount = pendingInvoices.length;
            const activeTasks = resolvePaymentTasks(year, 4, 5, false);
            const pendingPaymentCount = activeTasks.length;
            const greeting2 = getGreetingText(pendingReviewCount, pendingPaymentCount, activeTasks, year, 4, 5, 'normal');
            const el = document.getElementById('greeting2');
            el.classList.remove('reminder');
            typewrite(el, greeting2, 100);
        });

    let currentSimYear = year;
    let currentSimMonth = month;
    let currentSimDay = dayOfMonth;
    let currentScenario = 'normal';

    // ── Render ──
    function renderAll(simYear, simMonth, simDay, scenario) {
        currentSimYear = simYear;
        currentSimMonth = simMonth;
        currentSimDay = simDay;
        currentScenario = scenario;
        const taskList = document.getElementById('taskList');

        const skipAutoConsume = scenario.startsWith('remind-');

        const pendingReviewCount = pendingInvoices.length;

        const activePaymentTasks = resolvePaymentTasks(simYear, simMonth, simDay, skipAutoConsume);
        const pendingPaymentCount = activePaymentTasks.length;
        const consumedPaymentCount = paymentTasks.filter(
            t => t.reviewer === currentUser && t.consumed
        ).length;

        let html = '<div class="task-list">';
        let cardIdx = 0;

        // ── 1. Pending Review ──
        const jeReviewCount = 2;
        const hasReviewTasks = pendingReviewCount > 0 || jeReviewCount > 0;

        if (!hasReviewTasks) {
            html += `
            <div class="empty-review-card" id="emptyReviewCard"
                 style="transition: opacity 0.5s ease ${cardIdx * 80}ms, transform 0.5s ease ${cardIdx * 80}ms;">
                <div class="empty-review-icon">☕</div>
                <div class="empty-review-title">No pending tasks right now</div>
                <div class="empty-review-desc">Feel free to focus on your other work.</div>
            </div>`;
            cardIdx++;
        } else {
            html += `<div class="section-label">📋 Pending Review</div>`;
            html += `<div class="task-list">`;
            if (pendingReviewCount > 0) {
                html += `
                <a class="task-card" href="F-PAP-PAYMENT-REVIEW.html" target="_blank"
                   style="transition: opacity 0.5s ease ${cardIdx * 80}ms, transform 0.5s ease ${cardIdx * 80}ms, background 0.2s, box-shadow 0.2s;">
                    <span class="card-icon">📋</span>
                    <div class="card-body">
                        <div class="card-title">Invoice Review</div>
                        <div class="card-desc">${pendingReviewCount} invoice(s)</div>
                    </div>
                    <span class="card-chevron">›</span>
                </a>`;
                cardIdx++;
            }
            html += `
            <a class="task-card" href="F-JE-REVIEW-CHAT.html" target="_blank"
               style="transition: opacity 0.5s ease ${cardIdx * 80}ms, transform 0.5s ease ${cardIdx * 80}ms, background 0.2s, box-shadow 0.2s;">
                <span class="card-icon">📊</span>
                <div class="card-body">
                    <div class="card-title">JE Review</div>
                    <div class="card-desc">${jeReviewCount} JE(s)</div>
                </div>
                <span class="card-chevron">›</span>
            </a>`;
            cardIdx++;
            html += `</div>`;
        }

        // ── 2. Pending Payment（每月一条）──
        if (activePaymentTasks.length > 0) {
            html += `<div class="section-label">💰 Pending Payment</div>`;
            html += `<div class="task-list">`;

            const task = activePaymentTasks[0];
            const reminder = getPaymentReminderState(task, simYear, simMonth, simDay, scenario);

            let cls = ' payment-task compact';
            if (reminder.isReminder) {
                cls += ' urgent';
            }

            html += `
            <a class="task-card${cls}" href="#" onclick="goToFSystem(event)"
               style="transition: opacity 0.5s ease ${cardIdx * 80}ms, transform 0.5s ease ${cardIdx * 80}ms, background 0.2s, box-shadow 0.2s, border-color 0.3s;">
                <span class="card-icon">💰</span>
                <div class="card-body">
                    <div class="card-title">${task.monthLabel} Payment</div>
                    <div class="card-desc">${reminder.desc}</div>
                </div>
                <span class="card-chevron">›</span>
            </a>`;
            cardIdx++;

            html += `</div>`;
        }

        // ── 3. Payment Completed ──
        if (consumedPaymentCount > 0) {
            html += `<div class="section-label">✅ Payment Completed</div>`;
            html += `<div class="task-list">`;
            html += `
            <a class="task-card all-done" href="#" onclick="goToFSystem(event)"
               style="transition: opacity 0.5s ease ${cardIdx * 80}ms, transform 0.5s ease ${cardIdx * 80}ms, background 0.2s;">
                <span class="card-icon">✅</span>
                <div class="card-body">
                    <div class="card-title">Payment Completed</div>
                    <div class="card-desc">${consumedPaymentCount} monthly task(s) completed</div>
                </div>
            </a>`;
            html += `</div>`;
            cardIdx++;
        }

        html += '</div>';
        taskList.innerHTML = html;

        setTimeout(() => {
            taskList.querySelectorAll('.task-card').forEach((card, i) => {
                setTimeout(() => card.classList.add('visible'), i * 80);
            });
            const emptyCard = document.getElementById('emptyReviewCard');
            if (emptyCard) setTimeout(() => emptyCard.classList.add('visible'), 80);
        }, 100);

        document.getElementById('successBanner').classList.remove('show');

        const greetingEl = document.getElementById('greeting2');
        const task = activePaymentTasks[0];
        greetingEl.textContent = getGreetingText(pendingReviewCount, pendingPaymentCount, activePaymentTasks, simYear, simMonth, simDay, scenario);
        greetingEl.classList.toggle('reminder', !!(task && getPaymentReminderState(task, simYear, simMonth, simDay, scenario).isReminder));
    }

    function setActiveTestBtn(scenario) {
        document.querySelectorAll('.test-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.scenario === scenario);
        });
    }

    function applyScenario(scenario) {
        setActiveTestBtn(scenario);

        let simYear = year, simMonth = month, simDay = dayOfMonth;
        let scn = scenario;
        let dateLabel;

        switch (scenario) {
            case 'no-remind': {
                scn = 'normal';
                simYear = year;
                simMonth = 4;
                simDay = 5;
                ensurePaymentTask(simYear, simMonth);
                dateLabel = `${monthNames[simMonth]}/05/${simYear}`;
                document.getElementById('dateSub').textContent = '模拟：5 月初 · 无提醒';
                break;
            }
            case 'remind-tech':
            case 'remind-cp_rs':
            case 'remind-ip_ad': {
                const { dueYear, dueMonth } = getDueMonth(paymentTasks[0]);
                simYear = dueYear;
                simMonth = dueMonth;
                if (scenario === 'remind-tech') {
                    simDay = 1;
                    document.getElementById('dateSub').textContent = '模拟：技术服务费 · 次月初';
                } else if (scenario === 'remind-cp_rs') {
                    simDay = 15;
                    document.getElementById('dateSub').textContent = '模拟：CP / RS · 次月 15 日';
                } else {
                    simDay = getLastDayOfMonth(dueYear, dueMonth);
                    document.getElementById('dateSub').textContent = '模拟：IP / 广告费 · 次月末';
                }
                paymentTasks.forEach(t => { t.consumed = false; t.consumedBy = null; });
                dateLabel = `${monthNames[simMonth]}/${String(simDay).padStart(2,'0')}/${simYear}`;
                break;
            }
            default:
                dateLabel = `${monthNames[simMonth]}/${String(simDay).padStart(2,'0')}/${simYear}`;
                document.getElementById('dateSub').textContent = weekDays[today.getDay()];
        }
        document.getElementById('dateMain').textContent = dateLabel;
        renderAll(simYear, simMonth, simDay, scn);
    }

    applyScenario('no-remind');

    // ── Test Case Panel ──
    function toggleTestPanel() {
        document.getElementById('testPanel').classList.toggle('show');
    }

    function simulateDate(scenario) {
        applyScenario(scenario);
        document.getElementById('testPanel').classList.remove('show');
    }
</script>
